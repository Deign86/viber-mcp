[project]
name = "viber-mcp"
version = "0.1.0"
description = "MCP server to send and read Viber Desktop messages on macOS and Windows via UI automation"
readme = "README.md"
authors = [{ name = "Deign Lazaro" }, { name = "Wawi del Mundo" }]
requires-python = ">=3.14"
dependencies = [
    "mcp[cli]>=1.28.1",
    # macOS backend
    "pyobjc-framework-cocoa>=12.2.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-quartz>=12.2.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-vision>=12.2.1 ; sys_platform == 'darwin'",
    "pyobjc-framework-applicationservices>=12.2.1 ; sys_platform == 'darwin'",
    # cryptography 49 dropped Intel-Mac wheels; 48 still ships universal2 (else uv builds it with Rust).
    # The second line keeps every other platform on the 49 series it was locked to before (uv
    # would otherwise lock 48 for all, or move Windows to an untested major).
    "cryptography<49 ; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "cryptography>=49,<50 ; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    # Windows backend
    "pywin32>=311 ; sys_platform == 'win32'",
    "psutil>=7.0 ; sys_platform == 'win32'",
    "pillow>=11",  # Windows capture; view_listing_photos on every OS
    "winrt-runtime>=3.2 ; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2 ; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2 ; sys_platform == 'win32'",
    "winrt-Windows.Globalization>=3.2 ; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging>=3.2 ; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr>=3.2 ; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2 ; sys_platform == 'win32'",
    "uiautomation>=2.0.20 ; sys_platform == 'win32'",
    "google-api-python-client>=2.150",
    "google-auth-oauthlib>=1.2",
    "python-docx>=1.1",
]
