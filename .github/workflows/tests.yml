name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # The Windows backend (pywin32, UI Automation, WinRT OCR) only installs on Windows.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10
      - name: Install dependencies
        run: uv sync
      - name: Run tests (no Viber needed — pure logic and UI-structure fixtures)
        run: uv run --with pytest pytest tests -q
