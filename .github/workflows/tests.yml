name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    # Each backend's OS packages only install on its own OS (pywin32/WinRT, pyobjc).
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: uv sync
      - name: Run tests (no Viber needed — pure logic and UI-structure fixtures)
        run: uv run --with pytest pytest tests -q
      - name: Build the macOS launcher (setup_macos.sh compiles it), check the shell scripts
        if: runner.os == 'macOS'
        run: |
          cc -Wall -Werror -O2 -o "$RUNNER_TEMP/viber-mcp" macos/launcher.c
          bash -n setup_macos.sh
          bash -n macos/uninstall.sh

  extension:
    # Builds the Claude Desktop extension (download it from the run's Artifacts) and checks the
    # manifest with the official MCPB CLI. build.py needs only the standard library.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build dist/viber-mcp-<version>.mcpb
        run: python3 extension/build.py
      - name: Validate the manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate dist/viber-mcp/manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: viber-mcp-extension
          path: dist/*.mcpb
          if-no-files-found: error

  release:
    # Every merge to main becomes a GitHub Release once both test runs and the extension build
    # pass: version <major>.<minor>.<commits> (extension/build.py --release), the bundle attached
    # as viber-mcp.mcpb so .../releases/latest/download/viber-mcp.mcpb is always the newest.
    # The installed extension checks that release and tells Claude to pass the link on.
    needs: [pytest, extension]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the version counts commits
      - name: Build the release bundle
        id: build
        run: |
          python3 extension/build.py --release
          echo "version=$(python3 -c 'import json; print(json.load(open("dist/viber-mcp/manifest.json"))["version"])')" >> "$GITHUB_OUTPUT"
      - name: Validate the manifest
        run: npx --yes @anthropic-ai/mcpb@2.1.2 validate dist/viber-mcp/manifest.json
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          # Two quick merges: only the newer one publishes (it holds both), so "latest" never
          # goes back to an older build when the runs finish out of order.
          if [ "$(git ls-remote origin refs/heads/main | cut -f1)" != "$GITHUB_SHA" ]; then
            echo "main has moved past $GITHUB_SHA; the newer commit's run publishes."
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "v$VERSION is already released."
            exit 0
          fi
          cp "dist/viber-mcp-$VERSION.mcpb" dist/viber-mcp.mcpb
          gh release create "v$VERSION" dist/viber-mcp.mcpb --target "$GITHUB_SHA" \
            --title "Viber MCP $VERSION" --generate-notes --latest
